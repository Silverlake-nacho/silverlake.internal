<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Silverlake {{ mode_label }} Stats</title>
	<link rel="icon" href="{{ url_for('static', filename='SLK Logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
      :root {
        --sidebar-expanded: 260px;
        --sidebar-collapsed: calc(var(--sidebar-expanded) * 0.3);
        --sidebar-bg: #5c9c13;
      }
      body {
        margin: 0;
        background: url("{{ url_for('static', filename='background.jpg') }}") no-repeat center center fixed;
        background-size: cover;
        font-family: 'Montserrat', sans-serif;
        color: black;
      }
      h1, h2, label {
        color: #5c9c13;
      }
      .page-wrapper {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: var(--sidebar-collapsed);
        background-color: var(--sidebar-bg);
        color: #fff;
        position: fixed;
        inset: 0 auto 0 0;
        overflow: hidden;
        transition: width 0.3s ease;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px 12px;
        z-index: 1000;
      }
      .sidebar:hover {
        width: var(--sidebar-expanded);
      }
      .sidebar .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 10px;
      }
      .sidebar .logo-collapsed {
        height: 34px;
        opacity: 1;
        transition: opacity 0.2s ease;
      }
      .sidebar .logo-expanded {
        height: 34px;
        opacity: 0;
        transform: translateX(-6px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .sidebar:hover .logo-collapsed {
        opacity: 0;
      }
      .sidebar:hover .logo-expanded {
        opacity: 1;
        transform: translateX(0);
      }
      .sidebar .brand-text {
        font-weight: 700;
        font-size: 1.05rem;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .sidebar:hover .brand-text {
        opacity: 1;
      }
      .sidebar .nav-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sidebar .nav-link {
        color: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease;
        font-size: 0.95rem;
      }
      .sidebar .nav-link i {
        width: 20px;
        text-align: center;
        font-size: 1.15rem;
      }
      .sidebar .nav-link .link-text {
        white-space: nowrap;
        opacity: 0;
        transform: translateX(-6px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .sidebar:hover .nav-link .link-text {
        opacity: 1;
        transform: translateX(0);
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        background-color: rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .sidebar-footer {
        margin-top: auto;
      }
      .content {
        flex: 1;
        margin-left: var(--sidebar-collapsed);
        transition: margin-left 0.3s ease;
      }
      .sidebar:hover ~ .content {
        margin-left: var(--sidebar-expanded);
      }
      .content-inner {
        padding: 24px;
      }
      .toggle-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 1.5rem;
      }
      .toggle-label {
        font-weight: 600;
        color: #5c9c13;
      }
      .toggle {
        position: relative;
        width: 270px;
        height: 48px;
        background: #cde7b1;
        border-radius: 999px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        cursor: pointer;
        border: 2px solid #5c9c13;
        overflow: hidden;
      }
      .toggle input {
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        position: absolute;
        inset: 0;
        cursor: pointer;
        z-index: 3;
      }
      .toggle-track {
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc(50% - 8px);
        height: calc(100% - 8px);
        background: #5c9c13;
        border-radius: 999px;
        transition: transform 0.25s ease;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        z-index: 1;
      }
      .toggle input:checked + .toggle-track {
        transform: translateX(100%);
      }
      .toggle-labels {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        height: 100%;
        align-items: center;
        text-align: center;
        font-weight: 700;
        color: #1f3b08;
        pointer-events: none;
      }
      .toggle-labels span {
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
      }
      .toggle input:checked ~ .toggle-labels span:first-child {
        color: #2f2f2f;
      }
      .toggle input:not(:checked) ~ .toggle-labels span:last-child {
        color: #2f2f2f;
      }
      .btn-primary, .btn-success {
        background-color: #5c9c13;
        border: none;
      }
      .btn-primary:hover, .btn-success:hover {
        background-color: #4a8010;
      }
      .form-control {
        background-color: #d6f5c1;
        color: #333;
        border: 1px solid #333;
      }
      .form-control:focus {
        border-color: #5c9c13;
        box-shadow: 0 0 5px #5c9c13;
      }
      table {
        color: #f0f0f0;
        background-color: #111;
      }
      th, td {
        border-bottom: 1px solid #5c9c13;
      }
      .exclusion-card .exclusion-body {
        display: none;
      }
      .exclusion-card:hover .exclusion-body,
      .exclusion-card:focus-within .exclusion-body {
        display: block;
      }
      .logo {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 20px;
      }
      .logo img {
        width: 150px;
        max-width: 50%;
        height: auto;
      }
      .toggle-stack {
        display: flex !important;
        flex-direction: row;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      .parts-breakdown-trigger {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-decoration-thickness: 2px;
        text-decoration-color: #5c9c13;
      }
      @media (max-width: 768px) {
        :root {
          --sidebar-expanded: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <nav class="sidebar">
        <div class="brand">
          <img src="{{ url_for('static', filename='SLK Logo.png') }}" alt="Silverlake Collapsed Logo" class="logo-collapsed">
          <img src="{{ url_for('static', filename='logo-slg-strip.svg') }}" alt="Silverlake Logo" class="logo-expanded">
        </div>
                <div class="nav-section">
          <a href="{{ url_for('index') }}" class="nav-link{% if active_page == 'index' %} active{% endif %}">
            <i class="fas fa-magnifying-glass-dollar"></i>
            <span class="link-text">Opportunity Finder</span>
          </a>
          <a href="{{ url_for('crush_vehicles') }}" class="nav-link{% if active_page == 'crush_vehicles' %} active{% endif %}">
            <i class="fas fa-car-burst"></i>
            <span class="link-text">Crush Vehicles</span>
          </a>
     <!-- <a href="{{ url_for('crush_checker') }}" class="nav-link{% if active_page == 'crush_checker' %} active{% endif %}">
            <i class="fas fa-clipboard-list"></i>
            <span class="link-text">Crush Checker</span>
          </a>-->
          <a href="{{ url_for('logs') }}" class="nav-link{% if active_page == 'logs' %} active{% endif %}">
            <i class="fas fa-clipboard-list"></i>
            <span class="link-text">Logs</span>
          </a>
        </div>
        <div class="sidebar-footer">
          <a href="{{ url_for('logout') }}" class="nav-link">
            <i class="fas fa-arrow-right-from-bracket"></i>
            <span class="link-text">Logout ({{ current_user }})</span>
          </a>
        </div>
      </nav>
      <div class="content">
        <div class="content-inner">
          <div class="container">
            <div class="logo">
              <img src="{{ url_for('static', filename='logo-slg-strip.svg') }}" alt="Silverlake Logo">
            </div>


      <h1 class="mb-4 text-center">Silverlake Vehicle Crusher</h1>

     <!-- Form -->
  <form method="post" class="mb-4">
    <div class="row">
      <div class="col-md-6">
        <label class="form-label">Vehicle Registration</label>
        <input type="text" name="registration" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Stock Number</label>
        <input type="text" name="stock_number" class="form-control">
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Search</button>
  </form>

  <!-- If a vehicle is found -->
  {% if vehicle %}
    <h3>Vehicle Found</h3>
    <table class="table table-bordered">
      <tr><th>ID</th><td>{{ vehicle[0] }}</td></tr>
      <tr><th>Registration</th><td>{{ vehicle[1] }}</td></tr>
      <tr><th>Stock Number</th><td>{{ vehicle[2] }}</td></tr>
      <tr><th>Location ID</th><td>{{ vehicle[3] }}</td></tr>
    </table>

    <form method="post" action="{{ url_for('crush', vehicle_id=vehicle[0]) }}">
      <button type="submit" class="btn btn-danger">Crush</button>
    </form>
	
  {% elif error_message %}
  <!-- If no vehicle found -->
    <div class="alert alert-warning mt-3">
    {{ error_message }}
    </div>
    <form method="get" action="{{ url_for('crush_vehicles') }}">
      <button type="submit" class="btn btn-secondary">OK</button>
    </form>
  {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var flashModal = document.getElementById('flashModal');
    if (flashModal) {
      var modal = new bootstrap.Modal(flashModal);
      modal.show();
    }
  });
</script>

</body>

</html>
